name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  app:
    name: App (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --if-present

  web:
    name: Web (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Server (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # One run gives both the test result and the coverage report.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage gate (80% lines and branches per use case)
        run: npm run coverage:gate

      # Kept even when the gate fails, as evidence for the report.
      - name: Upload coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-summary
          path: server/coverage/coverage-summary.json
          if-no-files-found: warn
